spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/video_service
    username: video_service
    password: local_dev
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/devdata
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_JWKS_URL:http://user-service:8081/.well-known/jwks.json}
  data:
    redis:
      host: redis
  cloud:
    aws:
      sqs:
        endpoint: http://localstack:4566
